name: Forecast on the main tournament

# Scheduled runs start only once the owner has switched the bot live (repository variable BOT_LIVE).
# A manual run before that is a dry run, capped at a few questions so it cannot drain credits.
on:
  workflow_dispatch:
    inputs:
      max_questions:
        description: "Forecast at most this many questions (leave empty for all)"
        default: "3"
  schedule:
    # Three separate entries, off the hour: GitHub drops scheduled runs under load.
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name == 'workflow_dispatch' || vars.BOT_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 5
        with:
          python-version: "3.11"
      - name: Install Poetry
        timeout-minutes: 5
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        timeout-minutes: 15
        run: poetry install --no-interaction --no-root
      - name: Run bot
        timeout-minutes: 45
        run: |
          args=()
          if [[ -n "$MAX_QUESTIONS" ]]; then
            if [[ ! "$MAX_QUESTIONS" =~ ^[0-9]+$ ]]; then echo "max_questions must be a whole number"; exit 1; fi
            args+=(--max-questions "$MAX_QUESTIONS")
          fi
          poetry run python run_bot.py --mode main "${args[@]}"
        env:
          PYTHONUNBUFFERED: "1"
          MAX_QUESTIONS: ${{ inputs.max_questions }}
          BOT_PUBLISH: ${{ vars.BOT_LIVE }}
          BOT_RESEARCHER: ${{ vars.BOT_RESEARCHER }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
