name: CI

# Started by hand, once per landing that touches code: gh workflow run ci.yaml
# Uses no secrets and makes no forecasts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 5
        with:
          python-version: "3.11"
      - name: Install Poetry
        timeout-minutes: 5
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        timeout-minutes: 15
        run: poetry install --no-interaction --no-root
      - name: Unit tests of our own modules (standard library only)
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v
      - name: The bot builds against the installed framework
        timeout-minutes: 5
        run: poetry run python run_bot.py --self-check
      - name: Our method against the installed framework, with stand-in models (no network)
        timeout-minutes: 10
        run: poetry run python -m unittest discover -s tests_framework -v
